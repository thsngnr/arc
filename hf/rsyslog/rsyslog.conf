# rsyslog — HF host: IP bazlı klasörleme
# Gelen her kaynaktan log → /var/log/remote/<fromhost-ip>/syslog.log

module(load="imudp")
input(type="imudp" port="514" ruleset="RemoteStore")

module(load="imtcp")
input(type="imtcp" port="514" ruleset="RemoteStore")

module(load="imuxsock")
module(load="imklog" permitnonkernelfacility="on")

$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
$RepeatedMsgReduction on
$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

# Yerel loglar
*.info;mail.none;authpriv.none;cron.none  /var/log/messages
authpriv.*                                 /var/log/secure
mail.*                                    -/var/log/maillog
cron.*                                     /var/log/cron
*.emerg                                    :omusrmsg:*

# --- Uzak syslog: kaynak IP klasörleme ---
template(name="RemoteHostDir" type="string"
         string="/var/log/remote/%FROMHOST-IP%/syslog.log")

template(name="RemoteHostFmt" type="string"
         string="%TIMESTAMP% %HOSTNAME% %syslogtag%%msg%\n")

ruleset(name="RemoteStore") {
    # Dinamik dosya — klasör yoksa oluşturulur
    action(
        type="omfile"
        dynaFile="RemoteHostDir"
        template="RemoteHostFmt"
        dirCreateMode="0755"
        fileCreateMode="0640"
        asyncWriting="on"
        flushInterval="1"
    )
    stop
}
