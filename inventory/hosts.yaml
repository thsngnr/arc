# Lab / envanter — 5 host

vip: "10.20.0.100"
vip_iface: eth0
syslog_udp_port: 514
syslog_tcp_port: 514
syslog_tls_port: 6514
haproxy_stats_port: 8404

load_balancers:
  - name: lb1
    role: master
    ip: "10.20.0.1"
    priority: 150
    router_id: syslog_lb
  - name: lb2
    role: backup
    ip: "10.20.0.2"
    priority: 100
    router_id: syslog_lb

hf_hosts:
  - name: hf1
    ip: "10.20.0.11"
    weight: 100
    fwmark: 1
  - name: hf2
    ip: "10.20.0.12"
    weight: 100
    fwmark: 2
  - name: hf3
    ip: "10.20.0.13"
    weight: 100
    fwmark: 3

# Varsayılan (pinlenmemiş) trafik havuzu — LVS round-robin
default_pool_fwmark: 0
