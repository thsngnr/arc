# HAProxy — TCP syslog + stats
# UDP syslog keepalived LVS üzerinden gider; TCP/TLS burada

global
    log stdout format raw local0
    maxconn 4096
    stats timeout 30s
    daemon
    user haproxy
    group haproxy

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    retries 3

# TCP syslog 514 → HF rsyslog
frontend fe_syslog_tcp
    bind *:514
    mode tcp
    default_backend be_syslog_tcp

backend be_syslog_tcp
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect port 514
    server hf1 10.20.0.11:514 check inter 3s fall 2 rise 2 weight 100
    server hf2 10.20.0.12:514 check inter 3s fall 2 rise 2 weight 100
    server hf3 10.20.0.13:514 check inter 3s fall 2 rise 2 weight 100

# Opsiyonel TLS syslog (sertifika mount edilirse açın)
# frontend fe_syslog_tls
#     bind *:6514 ssl crt /etc/haproxy/certs/syslog.pem
#     mode tcp
#     default_backend be_syslog_tcp

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats auth admin:sysloglab
