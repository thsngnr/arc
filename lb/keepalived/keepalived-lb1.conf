# Keepalived — LB1 (MASTER)
# VIP + varsayılan LVS havuzu + fwmark include (volume_pin üretir)

global_defs {
    router_id syslog_lb1
    script_user root
    enable_script_security
    vrrp_version 3
}

vrrp_script chk_haproxy {
    script "/usr/lib/keepalived/check_haproxy.sh"
    interval 2
    weight -30
    fall 2
    rise 2
}

vrrp_instance VI_SYSLOG {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass syslogHF1
    }
    virtual_ipaddress {
        10.20.0.100/24
    }
    track_script {
        chk_haproxy
    }
}

# Varsayılan UDP syslog havuzu (pinlenmemiş kaynaklar)
virtual_server 10.20.0.100 514 {
    delay_loop 6
    lb_algo rr
    lb_kind DR
    protocol UDP
    persistence_timeout 300

    real_server 10.20.0.11 514 {
        weight 100
        TCP_CHECK {
            connect_timeout 3
            connect_port 514
        }
    }
    real_server 10.20.0.12 514 {
        weight 100
        TCP_CHECK {
            connect_timeout 3
            connect_port 514
        }
    }
    real_server 10.20.0.13 514 {
        weight 100
        TCP_CHECK {
            connect_timeout 3
            connect_port 514
        }
    }
}

# Otomatik fwmark pinleri (volume_pin.py yazar)
include /etc/keepalived/conf.d/fwmark-pins.conf
